name: Publish public npm packages

on:
  push:
    branches:
      - dev
    paths:
      - package.json
      - package-lock.json
      - '**/package.json'
      - '**/CHANGELOG.md'
      - .github/workflows/npm-publish.yml
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish packages to npm after validation"
        required: true
        type: boolean
        default: false
      skip-existing:
        description: "Skip package versions that already exist on npm"
        required: true
        type: boolean
        default: true
      registry-smoke:
        description: "Run the public registry smoke test after publishing"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24
  NODE_ENV: pipeline
  JWT_SECRET_PVT: dummydummy
  JWT_SECRET_PUB: dummydummy

jobs:
  validate:
    name: Validate public npm packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run framework checks
        run: npm run ci:checks

      - name: Validate public package tarballs
        run: npm run pack:dry-run

      - name: Validate npm publish metadata
        run: npm run publish:dry-run

      - name: Run tarball consumer smoke test
        run: npm run smoke:public:tarball

      - name: Validation-only summary
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.publish)
        run: |
          echo "Validation completed without publishing."

  publish:
    name: Publish public npm packages
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: validate
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build public package distribution
        run: npm run build

      - name: Configure npm token fallback
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -n "$NPM_TOKEN" ]]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi

      - name: Publish packages
        env:
          SKIP_EXISTING: ${{ github.event_name == 'release' || inputs['skip-existing'] }}
        run: |
          args=(--provenance)
          if [[ "$SKIP_EXISTING" == "true" ]]; then
            args+=(--skip-existing)
          fi

          node ./scripts/publish-public-packages.mjs "${args[@]}"

      - name: Run registry consumer smoke test
        if: github.event_name == 'release' || inputs['registry-smoke']
        run: |
          for attempt in {1..6}; do
            if npm run smoke:public:registry; then
              exit 0
            fi

            echo "Registry smoke failed on attempt ${attempt}; retrying after npm propagation delay."
            sleep 30
          done

          npm run smoke:public:registry
